<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
  <defs>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#667085}.section{font-size:22px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#667085}.code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace}.card{fill:#fff;stroke:#d0d5dd;stroke-width:2}.blue{fill:#eef4ff;stroke:#6291f7;stroke-width:2}.purple{fill:#f4f0ff;stroke:#8c6df2;stroke-width:2}.green{fill:#ecfdf3;stroke:#3fab6f;stroke-width:2}.yellow{fill:#fff7e8;stroke:#e9a23b;stroke-width:2}.red{fill:#fff1f0;stroke:#e35d54;stroke-width:2}.flow{fill:none;stroke:#667085;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#98a2b3;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
  </defs>
  <rect width="1440" height="1050" fill="#f6f8fc"/>
  <text x="50" y="60" class="title">TRON 节点能力：固化边界与 FullNode 主备读取</text>
  <text x="50" y="92" class="subtitle">Scanner只依赖TronNodeManager，不感知节点URL、API Key和主备关系</text>

  <rect x="40" y="125" width="1360" height="430" rx="22" class="card"/>
  <text x="70" y="168" class="section">一、统一读取链路</text>
  <rect x="70" y="205" width="235" height="210" rx="16" class="purple"/>
  <text x="92" y="240" class="heading">固化扫描业务</text>
  <text x="92" y="280" class="code">getSolidHeight()</text>
  <text x="92" y="314" class="code">getBlockHeader...</text>
  <text x="92" y="348" class="code">getBlockData...</text>
  <text x="92" y="388" class="small">不传nodeCode，不选节点</text>

  <rect x="360" y="205" width="270" height="210" rx="16" class="blue"/>
  <text x="385" y="240" class="heading">TronNodeManager</text>
  <text x="385" y="280" class="body">按能力调用Gateway</text>
  <text x="385" y="314" class="body">记录节点读取耗时</text>
  <text x="385" y="348" class="body">统一转换SDK异常</text>
  <text x="385" y="388" class="small">Scanner唯一节点入口</text>

  <rect x="685" y="205" width="270" height="210" rx="16" class="yellow"/>
  <text x="710" y="240" class="heading">NodePool + Client</text>
  <text x="710" y="280" class="body">按角色和优先级选点</text>
  <text x="710" y="314" class="body">失败时切换备用节点</text>
  <text x="710" y="348" class="body">发送请求并校验响应</text>
  <text x="710" y="388" class="small">一次切换必须完整重读</text>

  <rect x="1020" y="190" width="320" height="92" rx="15" class="green"/>
  <text x="1045" y="226" class="heading">FullNode A · 主节点</text>
  <text x="1045" y="257" class="small">完整区块、交易与回执</text>
  <rect x="1020" y="302" width="320" height="92" rx="15" class="green"/>
  <text x="1045" y="338" class="heading">FullNode B · 备用节点</text>
  <text x="1045" y="369" class="small">A失败时完整重读同一区块</text>
  <rect x="1020" y="414" width="320" height="92" rx="15" class="purple"/>
  <text x="1045" y="450" class="heading">SolidityNode</text>
  <text x="1045" y="481" class="small">只提供最新固化高度</text>

  <path d="M305 310 H350" class="flow"/><path d="M630 310 H675" class="flow"/>
  <path d="M955 270 L1010 235" class="flow"/><path d="M955 320 L1010 348" class="flow"/><path d="M955 370 L1010 460" class="flow"/>

  <rect x="40" y="590" width="1360" height="235" rx="22" class="card"/>
  <text x="70" y="635" class="section">二、三个高度不能混用</text>
  <rect x="70" y="675" width="385" height="105" rx="15" class="green"/>
  <text x="95" y="710" class="heading">FullNode Head = 1210</text>
  <text x="95" y="741" class="body">节点能提供到哪里</text><text x="95" y="766" class="small">只用于节点可读性与健康判断</text>
  <rect x="527" y="675" width="385" height="105" rx="15" class="purple"/>
  <text x="552" y="710" class="heading">SolidityNode = 1200</text>
  <text x="552" y="741" class="body">充值最多扫描到哪里</text><text x="552" y="766" class="small">本轮最终边界</text>
  <rect x="985" y="675" width="385" height="105" rx="15" class="yellow"/>
  <text x="1010" y="710" class="heading">本地检查点 = 1100</text>
  <text x="1010" y="741" class="body">已经完整成功到哪里</text><text x="1010" y="766" class="small">下一块从1101开始</text>

  <rect x="40" y="860" width="1360" height="145" rx="22" class="red"/>
  <text x="70" y="902" class="section">三、失败关闭规则</text>
  <text x="70" y="940" class="body">FullNode读取失败 → 备用节点完整重读 → 仍失败则停止本轮 → 检查点不推进</text>
  <text x="70" y="974" class="body">固化检查点Hash或父Hash不一致 → ERROR 916003 → 保留检查点和证据 → 人工核查</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1260" viewBox="0 0 1500 1260">
  <defs>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
      .subtitle{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#667085}
      .section{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#172033}
      .heading{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#202939}
      .body{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#344054}
      .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;fill:#667085}
      .code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#344054}
      .arrow{fill:none;stroke:#667085;stroke-width:2.4;marker-end:url(#arrow)}
      .ok{fill:none;stroke:#2e9d61;stroke-width:2.6;marker-end:url(#greenArrow)}
      .danger{fill:none;stroke:#d92d20;stroke-width:2.6;marker-end:url(#redArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#667085"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e9d61"/></marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d92d20"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="1500" height="1260" fill="#f6f8fc"/>
  <text x="55" y="62" class="title">TRON 固化充值扫描闭环</text>
  <text x="55" y="94" class="subtitle">只扫描 SolidityNode 已固化高度；Kafka ACK 后才推进检查点；固化证据异常时停止并保留现场</text>

  <rect x="40" y="125" width="1420" height="470" rx="22" fill="#fff" stroke="#d0d5dd"/>
  <text x="70" y="168" class="section">一、一次正常扫描怎样完成</text>

  <rect x="70" y="205" width="230" height="135" rx="16" fill="#eef4ff" stroke="#6291f7" filter="url(#shadow)"/>
  <text x="90" y="238" class="heading">1. 读取检查点</text>
  <text x="90" y="270" class="code">1000 / H1000</text>
  <text x="90" y="300" class="body">HeadScanProgressService</text>
  <text x="90" y="325" class="small">最后完整成功的固化区块</text>

  <rect x="335" y="205" width="230" height="135" rx="16" fill="#f4f0ff" stroke="#8c6df2" filter="url(#shadow)"/>
  <text x="355" y="238" class="heading">2. 复核检查点</text>
  <text x="355" y="270" class="body">节点1000必须仍是H1000</text>
  <text x="355" y="300" class="body">HeadBlockContinuityService</text>
  <text x="355" y="325" class="small">不一致直接阻断</text>

  <rect x="600" y="205" width="250" height="135" rx="16" fill="#ecfdf3" stroke="#3fab6f" filter="url(#shadow)"/>
  <text x="620" y="238" class="heading">3. 确定固化边界</text>
  <text x="620" y="270" class="code">solidHeight = 1200</text>
  <text x="620" y="300" class="code">本轮 1001～1100</text>
  <text x="620" y="325" class="small">不扫描未固化区块</text>

  <rect x="885" y="205" width="240" height="135" rx="16" fill="#fff7e8" stroke="#e9a23b" filter="url(#shadow)"/>
  <text x="905" y="238" class="heading">4. 逐块读取与解析</text>
  <text x="905" y="270" class="body">校验高度和父Hash</text>
  <text x="905" y="298" class="body">解析TRX / TRC20充值</text>
  <text x="905" y="325" class="small">只保留平台收款地址</text>

  <rect x="1160" y="205" width="250" height="135" rx="16" fill="#ecfafa" stroke="#31a5a5" filter="url(#shadow)"/>
  <text x="1180" y="238" class="heading">5. 发送最终充值</text>
  <text x="1180" y="270" class="code">DepositConfirmedEvent</text>
  <text x="1180" y="298" class="body">等待Kafka Broker ACK</text>
  <text x="1180" y="325" class="small">空区块跳过发送</text>

  <path d="M300 273 H325" class="arrow"/><path d="M565 273 H590" class="arrow"/>
  <path d="M850 273 H875" class="arrow"/><path d="M1125 273 H1150" class="arrow"/>

  <rect x="460" y="395" width="580" height="125" rx="18" fill="#eefbf3" stroke="#2e9d61" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="430" class="heading">6. ACK成功后推进检查点</text>
  <text x="490" y="463" class="code">1000 / H1000  →  1001 / H1001</text>
  <text x="490" y="493" class="body">推进成功才继续1002；每块只做一次短数据库更新</text>
  <path d="M1285 340 V370 H1040 V445" class="ok"/>

  <rect x="40" y="625" width="690" height="390" rx="22" fill="#fff" stroke="#d0d5dd"/>
  <text x="70" y="670" class="section">二、普通故障：保留检查点并重试</text>
  <rect x="75" y="710" width="620" height="78" rx="14" fill="#fff7e8" stroke="#e9a23b"/>
  <text x="98" y="743" class="heading">节点读取 / 解析 / Kafka ACK 失败</text>
  <text x="98" y="770" class="body">当前区块未完成，检查点不动，下轮从同一高度重新处理</text>
  <rect x="75" y="820" width="620" height="100" rx="14" fill="#f4f0ff" stroke="#8c6df2"/>
  <text x="98" y="853" class="heading">Kafka已ACK，但数据库更新失败</text>
  <text x="98" y="880" class="body">仍保持旧检查点并重发；Chain Server按充值唯一键幂等接收</text>
  <text x="98" y="906" class="small">允许重复消息，禁止跳过可能未落库的区块</text>
  <path d="M385 788 V810" class="arrow"/>
  <text x="70" y="972" class="body">结果：前面成功区块保留，失败区块及其后续区块不推进。</text>

  <rect x="770" y="625" width="690" height="390" rx="22" fill="#fff" stroke="#d0d5dd"/>
  <text x="800" y="670" class="section">三、固化证据异常：停止并人工核查</text>
  <rect x="805" y="710" width="620" height="126" rx="14" fill="#fff1f0" stroke="#e35d54"/>
  <text x="830" y="744" class="heading">任一条件不成立</text>
  <text x="830" y="774" class="body">检查点Hash不同 ｜ 新块高度不连续 ｜ 父Hash接不上</text>
  <text x="830" y="806" class="code">ERROR 916003 · SOLIDIFIED_SCAN_CHAIN_INVALID</text>
  <rect x="805" y="870" width="620" height="100" rx="14" fill="#f9fafb" stroke="#98a2b3"/>
  <text x="830" y="904" class="heading">处理结果</text>
  <text x="830" y="932" class="body">停止本轮，不发异常区块，不改检查点，不自动回退</text>
  <text x="830" y="958" class="small">人工核对FullNode、SolidityNode、网络配置和数据库证据</text>
  <path d="M1115 836 V860" class="danger"/>

  <rect x="40" y="1045" width="1420" height="165" rx="22" fill="#172033"/>
  <text x="70" y="1088" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#fff">四、可靠性结论</text>
  <text x="70" y="1127" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#e4e7ec">固化边界保证只处理最终区块　·　连续性校验防止错误节点数据静默流入　·　Kafka ACK 后推进防止漏单</text>
  <text x="70" y="1161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="16" fill="#e4e7ec">失败保持检查点并重放　·　Chain Server幂等去重　·　固化证据异常保留现场并等待人工处理</text>
  <text x="70" y="1192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#a9c4ff">HeadBlockScanJob → HeadBlockScanService → Continuity → Discovery → Kafka ACK → Progress</text>
</svg>
